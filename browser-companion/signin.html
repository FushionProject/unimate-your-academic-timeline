<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secure sign-in · UniMate</title>
    <link rel="stylesheet" href="signin.css" />
    <script src="signin.js" defer></script>
  </head>
  <body>
    <main>
      <img class="mascot" src="assets/mascot.png" alt="" />
      <p class="eyebrow">UNIMATE COMPANION</p>
      <h1>A little help, right beside you.</h1>
      <p class="intro">Sign in with your UniMate account to pick up where you left off.</p>
      <form id="signin-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <label class="show-password"
          ><input id="show-password" type="checkbox" /> Show password</label
        >
        <button id="submit" type="submit">Sign in</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="privacy">
        This private extension window keeps your password separate from the website you’re viewing.
      </p>
      <button id="open-account" type="button" class="secondary">
        Need an account or password help?
      </button>
      <button id="return" type="button" class="secondary" hidden>Return to your page</button>
    </main>
  </body>
</html>
